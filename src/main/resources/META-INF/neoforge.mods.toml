modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="icon.png"
displayURL="https://github.com/MRevenger/MekExDeorum"
issueTrackerURL="https://github.com/MRevenger/MekExDeorum/issues"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "required"
versionRange = "${mekanism_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "exdeorum"
type = "required"
versionRange = "${exdeorum_version_range}"
ordering = "AFTER"
side = "BOTH"
